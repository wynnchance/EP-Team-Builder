name: Test EVA1 roster import
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/eva1-import.test.cjs
      - run: node tests/engine.test.cjs
      - name: index.html matches app_template.html + heroes_full.json
        run: python3 -c "import sys; d=open('heroes_full.json').read(); t=open('app_template.html').read(); sys.exit(0 if open('index.html').read()==t.replace('__HERO_DATA__', d) else 'index.html is stale: rebuild it from app_template.html')"
